name: Release container and notes
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ha-ai-studio/ha-ai-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and image destination
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_metadata.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Test release tooling including Git history ranges
        run: python3 -m unittest discover -s tests -p 'test_release*.py' -v
      - name: Build amd64 release image once
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: docker compose build --quiet
      - name: Run all checks in parallel on the release image
        run: python3 scripts/parallel_checks.py
      - name: Prepare release notes
        id: notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_MODEL: ${{ vars.OPENAI_RELEASE_MODEL }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish the exact tested image
        env:
          TARGET: ${{ steps.metadata.outputs.target }}
        run: |
          docker tag ha-ai-studio:dev "$TARGET"
          docker push "$TARGET"
          echo "Published: $TARGET (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "HA AI Studio $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
