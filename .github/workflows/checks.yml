name: Checks
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit and API tests
        run: ./scripts/test.sh
      - name: MQTT integration tests
        run: ./scripts/test-mqtt.sh
      - name: TLS and topic permissions
        run: ./scripts/test-mqtt-security.sh
      - name: Security checks
        run: ./scripts/security-check.sh
      - name: Build public source archive
        run: python3 scripts/package.py
