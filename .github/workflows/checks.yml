name: Checks
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build amd64 image once
        run: docker compose build --quiet
      - name: Run all checks in parallel on the built image
        run: python3 scripts/parallel_checks.py
      - name: Build public source archive
        run: python3 scripts/package.py
